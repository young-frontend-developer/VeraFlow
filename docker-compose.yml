services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: veraflow
      POSTGRES_USER: veraflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env or shell}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

  api:
    build: ./api
    ports:
      - "8000:8000"
    env_file:
      - ./api/.env
    volumes:
      - hf-cache:/cache/huggingface
      - /srv/veraflow-data:/data
    restart: unless-stopped
    mem_limit: 3g
    depends_on:
      - db

volumes:
  hf-cache:
  pgdata:
