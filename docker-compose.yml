services:
  api:
    build: ./api
    ports:
      - "8000:8000"
    env_file:
      - ./api/.env
    volumes:
      - hf-cache:/cache/huggingface
    restart: unless-stopped
    # The model needs ~1.5 GB resident in bfloat16. On a 4 GB box, cap it so an
    # OOM kills the container cleanly instead of the whole host.
    mem_limit: 3g

volumes:
  hf-cache:
