services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: veraflow
      POSTGRES_USER: veraflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env or shell}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veraflow"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: ./api
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ./api/.env
    volumes:
      - hf-cache:/cache/huggingface
      - /srv/veraflow-data:/data
    restart: unless-stopped
    mem_limit: 3g
    depends_on:
      db:
        condition: service_healthy

volumes:
  hf-cache:
  pgdata:
